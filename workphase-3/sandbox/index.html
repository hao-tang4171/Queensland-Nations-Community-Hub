<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECO7140 HAOTANG A3</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/pages/index.css">
</head>



<body>
    <div class="form-wrapper">
        <div class="card form-card">

            <h2 class="form-card__title">Stay Connected</h2>
            <p class="form-card__subtitle">Subscribe to receive community updates.</p>
            <form id="newsletter-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" required>
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" required>
                </div>

                <div class="form-group">
                    <label for="frequency">Newsletter frequency</label>
                    <select id="frequency" name="frequency" required>
                        <option value="">Select a frequency</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                    </select>
                </div>

                <button type="submit" id="submit-button" class="btn-submit">Subscribe</button>

                <p id="form-message" role="status" aria-live="polite"></p>
            </form>
        </div>
    </div>

    <script type="module" src="js/pages/index.js"></script>
</body>

</html>
